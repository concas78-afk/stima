<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stima">
  <!-- Colore brand: puoi cambiarlo modificando i due stop qui sotto -->
  <defs>
    <linearGradient id="stima-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Badge arrotondato -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#stima-grad)"/>
  <!-- Righe "documento" (il preventivo) -->
  <rect x="15" y="15" width="34" height="5" rx="2.5" fill="#ffffff" opacity="0.38"/>
  <rect x="15" y="24" width="22" height="5" rx="2.5" fill="#ffffff" opacity="0.38"/>
  <!-- Spunta (approvato / lavoro fatto) -->
  <path d="M16 42 L26 52 L48 30" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
